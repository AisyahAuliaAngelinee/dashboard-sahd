<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Executive RP — Notifikasi</title><style>
*{box-sizing:border-box}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f7f7;color:#172b3a}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #60a5fa;outline-offset:3px}[hidden]{display:none!important}.navbar{height:80px;background:white;display:flex;align-items:center;gap:24px;padding:0 28px;border-bottom:1px solid #e5ebed}.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.mark,.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#159b89;color:white;font-weight:700}.brand small{display:block;font-size:10px;color:#71838c;margin-top:4px}.search{margin-left:36px;max-width:600px;flex:1;background:#f3f7f7;border:0;border-radius:24px;padding:13px 18px;text-align:left;color:#71838c}.search kbd{float:right;background:white;border-radius:6px;padding:1px 7px;font-size:11px}.bell{margin-left:auto;position:relative;border:0;background:#e4f5f1;border-radius:12px;padding:12px;color:#177d6e}.badge{position:absolute;top:-3px;right:-3px;background:#1677d2;color:white;min-width:19px;padding:2px 5px;border-radius:10px;font-size:11px}.avatar{background:#e4f5f1;color:#177d6e}.shell{display:flex;min-height:calc(100vh - 80px)}aside{background:white;width:230px;padding:30px 20px;flex-shrink:0}aside p{padding:13px 15px;border-radius:24px;color:#71838c}aside .active{background:#e4f5f1;color:#177d6e}main{padding:32px;width:100%;max-width:1200px}h1{font-size:28px}h2{font-size:22px}.muted{color:#71838c}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{padding:24px;background:white;border-radius:20px;margin-bottom:20px}.number{font-size:34px;font-weight:700;margin:14px 0}.panel{position:fixed;right:28px;top:92px;width:min(680px,calc(100vw - 32px));max-height:calc(100dvh - 108px);overflow:hidden;display:flex;flex-direction:column;background:white;border:1px solid #e0e4e7;border-radius:12px;box-shadow:0 12px 40px #19313e17;z-index:10}.panelhead{padding:22px 24px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.panelhead h2{margin:0 0 8px;font-size:22px;color:#41474c}.panelhead p{margin:0;color:#929aa1}.readall{border:0;background:none;color:#1677d2;font-weight:600;white-space:nowrap;padding:8px 0}.readall:disabled{color:#929aa1;cursor:default}.tabs{display:flex;gap:12px;padding:12px 24px 20px;flex-shrink:0}.tab{background:white;border:1px solid #d5d9dd;border-radius:6px;padding:12px 22px;color:#41474c;font-size:16px;font-weight:500}.tab[aria-selected=true]{color:#1677d2;background:#edf6ff;border-color:#8dc2ef}.items{overflow-y:auto;overscroll-behavior:contain;padding:0 16px 8px}.item{width:100%;display:flex;gap:18px;padding:20px 8px;border:0;background:white;text-align:left;border-radius:8px;color:inherit;align-items:flex-start}.item:hover{background:#f7fafc}.itemicon{width:44px;height:44px;border:1px solid #e0e4e7;border-radius:6px;display:grid;place-items:center;color:#4a5156;flex-shrink:0}.itemcontent{flex:1;min-width:0}.itemtitle{display:block;font-size:18px;font-weight:600;color:#20282e;line-height:1.4;margin-bottom:10px}.itemdescription{display:block;font-size:15px;line-height:1.6;color:#5e676e}.itemtime{display:block;color:#979fa5;font-size:13px;margin-top:12px}.dot{width:10px;height:10px;flex-shrink:0;background:#1677d2;border-radius:50%;margin-top:6px}.dot.read{background:transparent}.foot{border-top:1px solid #eef1f3;padding:12px 24px;color:#71838c;font-size:12px}.empty{padding:40px;text-align:center;color:#71838c}.back{border:0;background:#e4f5f1;color:#177d6e;border-radius:10px;padding:10px 16px}.label{display:inline-block;background:#e4f5f1;border-radius:16px;padding:6px 12px;color:#177d6e}.highlight{background:#fff4cb;border:1px solid #f1d97b;padding:18px;border-radius:12px;scroll-margin-top:30px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#172b3a;color:white;padding:12px 22px;border-radius:12px;z-index:20}.hint{line-height:1.5;font-size:13px;color:#71838c}.detail p{line-height:1.7}.shortcuts{font-size:12px;color:#71838c}@media(max-width:760px){aside{display:none}.navbar{padding:0 16px;gap:12px}.brand small,.search,.username{display:none}main{padding:20px}.cards{grid-template-columns:1fr}.panel{right:16px;top:88px;max-height:calc(100dvh - 100px)}.panelhead{padding:18px 18px 8px}.panelhead h2{font-size:19px}.panelhead p{font-size:12px}.readall{font-size:13px}.tabs{padding:12px 18px;gap:8px}.tab{padding:10px 14px;font-size:14px}.itemtitle{font-size:16px}.itemdescription{font-size:14px}}
</style></head><body>
<header class="navbar"><a class="logo" href="#dashboard"><span class="mark">ER</span><span class="brand"><strong>Executive RP</strong><small>OPERATIONS PORTAL</small></span></a><div class="search">Cari pasien, laporan, atau employee… <kbd>⌘K / Ctrl K</kbd></div><button class="bell" id="bell" aria-label="Buka notifikasi" aria-expanded="true" aria-controls="notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span class="badge" id="badge">3</span></button><span class="avatar">AM</span><span class="username">Alex Morgan</span></header>
<div class="shell"><aside><p class="active">Dashboard</p><p>Duty Employee</p><p>Pasien</p><p>Janji Temu</p><p>Medical Reports</p><p>FD Reports</p><p>Pengaturan</p></aside><main id="main"></main></div>
<section class="panel" id="notifications" aria-labelledby="notification-title"><div class="panelhead"><div><h2 id="notification-title">Notification</h2><p id="unread" aria-live="polite">You have 3 new notifications</p></div><button class="readall" id="readall">Mark all as read</button></div><div class="tabs" role="tablist" aria-label="Filter notifikasi"><button class="tab" role="tab" aria-selected="true" aria-controls="items" id="tab-all" tabindex="0" data-filter="all">All</button><button class="tab" role="tab" aria-selected="false" aria-controls="items" id="tab-mentioned" tabindex="-1" data-filter="mentioned">Mentioned</button><button class="tab" role="tab" aria-selected="false" aria-controls="items" id="tab-appointment" tabindex="-1" data-filter="appointment">Janji Temu</button></div><div class="items" id="items" role="tabpanel" aria-labelledby="tab-all"></div><div class="foot">Klik notifikasi untuk membuka detail • Esc untuk menutup</div></section><div class="toast" id="toast" role="status" hidden></div>
<script>
const notices=[
{id:'n1',type:'report',title:'Laporan menunggu review',body:'Jamie Park mengirim laporan MR-2026-0042 untuk ditinjau.',date:'8 Oktober 2026 · 20.45 WIB',read:false,target:'#report/MR-2026-0042'},
{id:'n2',type:'mentioned',title:'Anda disebut dalam medical report',body:'Jamie Park menandai @Alex Morgan pada catatan tindak lanjut MR-2026-0042.',date:'8 Oktober 2026 · 20.30 WIB',read:false,target:'#report/MR-2026-0042/mention/M-001'},
{id:'n3',type:'appointment',title:'Janji temu baru untuk Anda',body:'Jordan Blake dijadwalkan bertemu Dr. Alex Morgan pada 9 Oktober 2026 pukul 21.00 WIB.',date:'8 Oktober 2026 · 20.15 WIB',read:false,target:'#appointment/APT-2026-0128'},
{id:'n4',type:'report',title:'Revisi laporan tersimpan',body:'Revisi laporan MR-2026-0042 tersimpan dan menunggu review.',date:'8 Oktober 2026 · 19.50 WIB',read:true,target:'#report/MR-2026-0042'}];
let filter='all',timer;const panel=document.querySelector('#notifications'),bell=document.querySelector('#bell'),main=document.querySelector('#main');const icon='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>';
function showToast(text){const el=document.querySelector('#toast');el.textContent=text;el.hidden=false;clearTimeout(timer);timer=setTimeout(()=>el.hidden=true,2200)}
function setOpen(open,focus=false){panel.hidden=!open;bell.setAttribute('aria-expanded',String(open));if(focus&&open)document.querySelector('[role=tab][aria-selected=true]').focus();if(focus&&!open)bell.focus()}
function render(){const count=notices.filter(n=>!n.read).length;document.querySelector('#unread').textContent=count?'You have '+count+' new notifications':'All notifications have been read';document.querySelector('#badge').textContent=count;document.querySelector('#badge').hidden=count===0;bell.setAttribute('aria-label','Notifikasi, '+count+' belum dibaca');document.querySelector('#readall').disabled=count===0;document.querySelectorAll('[data-filter]').forEach(t=>{const active=t.dataset.filter===filter;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1});const list=document.querySelector('#items');list.setAttribute('aria-labelledby','tab-'+filter);list.replaceChildren();const filtered=notices.filter(n=>filter==='all'||n.type===filter);for(const n of filtered){const b=document.createElement('button');b.className='item';b.setAttribute('aria-label',n.title+(n.read?', sudah dibaca':', belum dibaca'));b.innerHTML='<span class="itemicon" aria-hidden="true">'+icon+'</span><span class="itemcontent"><span class="itemtitle"></span><span class="itemdescription"></span><time class="itemtime"></time></span><span class="dot '+(n.read?'read':'')+'" aria-hidden="true"></span>';b.querySelector('.itemtitle').textContent=n.title;b.querySelector('.itemdescription').textContent=n.body;b.querySelector('.itemtime').textContent=n.date;b.onclick=()=>{n.read=true;render();setOpen(false);if(location.hash===n.target)route();else location.hash=n.target};list.append(b)}if(!filtered.length){const e=document.createElement('p');e.className='empty';e.textContent='Belum ada notifikasi untuk filter ini.';list.append(e)}}
for(const t of document.querySelectorAll('[data-filter]'))t.onclick=()=>{filter=t.dataset.filter;render()};document.querySelector('.tabs').onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const tabs=[...document.querySelectorAll('[data-filter]')];let i=tabs.findIndex(t=>t.dataset.filter===filter);i=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;filter=tabs[i].dataset.filter;render();tabs[i].focus()};bell.onclick=()=>setOpen(panel.hidden,true);document.querySelector('#readall').onclick=()=>{notices.forEach(n=>n.read=true);render();showToast('Semua notifikasi ditandai sudah dibaca.')};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden)setOpen(false,true)});document.addEventListener('click',e=>{if(!panel.hidden&&!panel.contains(e.target)&&!bell.contains(e.target)&&!e.target.closest('#reset'))setOpen(false)});
function route(){const hash=location.hash;let content;if(hash.startsWith('#appointment/'))content='<button class="back" onclick="location.hash=\'#dashboard\'">← Dashboard</button><h1 tabindex="-1">Detail janji temu</h1><div class="card detail"><span class="label">APT-2026-0128 · Terkonfirmasi</span><h2>Jordan Blake</h2><p>Dokter tujuan: Dr. Alex Morgan<br>Jadwal: 9 Oktober 2026, 21.00 WIB<br>Spesialisasi: Orthopedic RP<br>Keperluan: kontrol pasca tindakan RP</p></div>';else if(hash.startsWith('#report/'))content='<button class="back" onclick="location.hash=\'#dashboard\'">← Dashboard</button><h1 tabindex="-1">Medical report</h1><div class="card detail"><span class="label">MR-2026-0042 · Menunggu review</span><h2>Jordan Blake · Minor surgery</h2><p>Penulis: Dr. Jamie Park<br>Tanggal tindakan: 8 Oktober 2026<br>Dokumen simulasi untuk review tampilan.</p><h2>Catatan tindak lanjut</h2><div id="mention" class="'+(hash.includes('/mention/')?'highlight':'')+'"><strong>@Alex Morgan</strong><p>Mohon tinjau catatan kontrol pasien sebelum laporan difinalisasi.</p></div></div>';else content='<h1 tabindex="-1">Selamat bertugas, Alex 👋</h1><p class="muted">Ringkasan operasi dan aktivitas rumah sakit.</p><div class="cards"><div class="card">Total operasi<div class="number">42</div><small class="muted">Kasus final</small></div><div class="card">Employee duty<div class="number">9</div><small class="muted">Sedang bertugas</small></div><div class="card">Janji temu<div class="number">4</div><small class="muted">Hari ini</small></div></div><div class="card"><h2>Preview notifikasi</h2><p>Gunakan ikon lonceng di navbar untuk membuka panel. Coba filter, tandai dibaca, dan klik item untuk menuju detail.</p><p class="hint">Semua data contoh. Status dibaca hanya bertahan selama halaman ini terbuka; tidak tersimpan ke server.</p><button class="back" id="reset">Reset demo</button></div>';main.innerHTML=content;const reset=document.querySelector('#reset');if(reset)reset.onclick=()=>{notices.forEach((n,i)=>n.read=i===3);filter='all';render();setOpen(true)};if(hash.includes('/mention/')){const el=document.querySelector('#mention');el.tabIndex=-1;el.focus();el.scrollIntoView({block:'center',behavior:'smooth'})}else if(hash)main.querySelector('h1').focus()}
window.addEventListener('hashchange',route);render();route();
</script></body></html>
